name: Hata kaydı
description: Programda bir sorun mu gördünüz? Buradan bildirin.
title: "[Hata] "
labels: ["hata"]
body:
  - type: markdown
    attributes:
      value: |
        Bildiriminiz için teşekkürler! Teknik bilgi gerekmez; gördüğünüzü kendi cümlelerinizle anlatmanız yeterli.
        Yıldızlı (*) alanlar zorunludur.

  - type: dropdown
    id: bolum
    attributes:
      label: Sorun nerede?
      options:
        - Kurulum
        - Programın açılışı / karşılama ekranı
        - Şarkı çalma / ses
        - Müzik kütüphanesi
        - Görseller (sahneler)
        - Şarkı sözleri
        - Ekolayzer, kulaklık düzeltmesi, crossfeed ve ses ayarları
        - İşaretleme / şarkı haritası dosyası
        - Senkron (ses ile görüntü aynı anda değil)
        - Kör test
        - Ayarlar
        - Diğer
    validations:
      required: true

  - type: textarea
    id: ne-oldu
    attributes:
      label: Ne oldu?
      description: Gördüğünüz sorunu anlatın. Hata mesajı çıktıysa metnini buraya yazın.
      placeholder: "Örnek: Şarkıyı başlatınca ses geliyor ama görseller donuyor."
    validations:
      required: true

  - type: textarea
    id: beklenen
    attributes:
      label: Ne olmasını bekliyordunuz?
      placeholder: "Örnek: Görsellerin müzikle birlikte hareket etmesini."
    validations:
      required: true

  - type: textarea
    id: adimlar
    attributes:
      label: Sorunu nasıl tekrar oluşturabiliriz?
      description: Adım adım yazın. Bilmiyorsanız boş bırakabilirsiniz.
      placeholder: |
        1. Programı açtım
        2. Kütüphaneden bir şarkı seçtim
        3. ...

  - type: dropdown
    id: siklik
    attributes:
      label: Ne sıklıkla oluyor?
      options:
        - Her seferinde
        - Bazen
        - Yalnızca bir kez oldu
    validations:
      required: true

  - type: input
    id: surum
    attributes:
      label: Program sürümü
      description: Sağ üstteki **dişli simgesine (Ayarlar)** basın (düğmeler görünmüyorsa fareyi oynatın); "Program" bölümünde "Sürüm ... · ..." olarak yazar (sürüm ve derleme kodu; ikisini de yazın). Program açılmıyorsa "Açılmıyor" yazın.
      placeholder: "0.0.57 · a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: Windows sürümü
      options:
        - Windows 11
        - Windows 10
        - Bilmiyorum / Diğer

  - type: textarea
    id: gunluk
    attributes:
      label: Hata günlüğü
      description: |
        Sağ üstteki **dişli simgesine (Ayarlar)** basın, "Program" bölümündeki **Hata günlüğü** düğmesine basın; açılan klasörde seçili duran
        `lyraska.log` dosyasını bu kutuya sürükleyip bırakın. Program çöktüyse yeniden açıp aynı şeyi yapın:
        çökme bilgisi dosyada kalır. Program hiç açılmıyorsa Dosya Gezgini'nin adres çubuğuna
        `%LOCALAPPDATA%\io.github.gozlemesevdalisi.lyraska\logs` yazıp Enter'a basın; `lyraska.log` oradadır.
        Dosyada program sürümü ve derleme kodu, Windows sürümü ve hata mesajları vardır;
        hata mesajlarında şarkı dosyalarının adı ve klasör yolu (Windows kullanıcı adınız dahil) geçebilir.
        İsterseniz eklemeden önce Not Defteri ile açıp bakabilirsiniz. Şarkıların kendisi dosyada yoktur.

  - type: textarea
    id: ek
    attributes:
      label: Ekran görüntüsü, video veya şarkı bilgisi
      description: Ekran görüntüsünü ya da videoyu bu kutuya sürükleyip bırakabilirsiniz. Sorun belirli bir şarkıda oluyorsa dosya türünü (MP3, FLAC vb.) yazın.

  - type: checkboxes
    id: saglik
    attributes:
      label: Işık hassasiyeti
      options:
        - label: Görsellerde göz yoran ya da rahatsız edici yanıp sönme fark ettim (öncelikli incelenir).
