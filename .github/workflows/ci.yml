# main'e push ve her PR'da: arayüz (TypeScript) ve çekirdek (Rust) testleri, lint, lisans,
# güvenlik uyarısı ve iş akışı denetimi; Windows'ta Clippy ve testler. PR'larda ayrıca Windows
# kurulum dosyası derlenir ve "Artifacts" bölümüne eklenir. main'de CI yeşil bitince "Test sürümü"
# iş akışı çalışır.
#
# Üçüncü taraf eylemler commit SHA'sıyla sabitlenir (yorumdaki etiket bilgi içindir). Rust araç
# zinciri rust-toolchain.toml'dan, Node sürümü .nvmrc'den gelir: yerel derlemeyle aynı.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  arayuz:
    name: Arayüz (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Ses dosyası denetimi bütün geçmişe bakar: bir kez girip silinen ses de geçmişte kalır.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Biçim denetimi (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tür denetimi (TypeScript)
        run: npm run typecheck
      - name: Testler (Vitest)
        run: npm test
      - name: Lisans denetimi
        run: npm run check:licenses
      - name: Depoda ses dosyası yok (telif; bütün geçmiş)
        run: npm run check:audio -- --history
      - name: Belgeler kodla uyumlu mu
        run: npm run check:docs
      - name: Kurallar (unsafe, atlanan test, uzak adres, CSP, izinler)
        run: npm run check:rules
      - name: Komut sözleşmesi (arayüz ↔ çekirdek)
        run: npm run check:commands
      - name: Derleme
        run: npm run build

  cekirdek:
    name: Çekirdek (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux derleme bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # Tauri, derleme sırasında arayüz dosyalarını (dist/) gömer.
      - name: Arayüzü derle
        run: |
          npm ci
          npm run build
      - name: Rust araç zinciri (rust-toolchain.toml)
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - name: Biçim denetimi (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Lint (Clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      # Testler Rust → arayüz veri tiplerini src/lib/bindings/ altına yeniden üretir (ts-rs).
      # Klasör önce boşaltılır: silinen bir Rust tipinin eski .ts dosyası da fark edilir.
      - name: Eski arayüz tiplerini kaldır
        run: rm -f src/lib/bindings/*.ts
      - name: Testler
        working-directory: src-tauri
        # Takılan bir test işi bütün süre boyunca bekletmesin.
        timeout-minutes: 15
        run: cargo test --locked
      # Depodakiyle aynı olmalı: Rust'ta değişen bir tip arayüzde fark edilmeden kalamaz.
      - name: Arayüz tipleri güncel mi (ts-rs)
        run: |
          if [ -n "$(git status --porcelain -- src/lib/bindings)" ]; then
            echo "src/lib/bindings güncel değil. 'cd src-tauri && cargo test' ile üretip commit edin:"
            git status --porcelain -- src/lib/bindings
            git diff -- src/lib/bindings
            exit 1
          fi
      - name: Lisans ve kaynak denetimi (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
      # Pakete giren crate ve npm paketlerinin lisans bildirimleri (public/lisanslar/UCUNCU-TARAF.txt)
      # depodakiyle aynı mı? Windows hedefinin crate'leri önce indirilir.
      - name: Üçüncü taraf lisans bildirimleri güncel mi
        run: |
          (cd src-tauri && cargo fetch --locked --target x86_64-pc-windows-msvc)
          npm run check:notices

  hlsl:
    name: HLSL çevirici (WebAssembly)
    # MilkDrop gölgelendirici çeviricisi (src-tauri/hlsl/hlslparser.wasm) depodaki kaynaktan
    # (vendor/hlslparser + hlsl/shim.cpp) sabit araç takımıyla (wasi-sdk 30.0, SHA-256 denetimli)
    # yeniden derlenir: baytı baytına aynı olmalı. Depodaki ikili dosya kaynağından başka bir şey
    # olamaz. Araç takımı önbellekte durur (~120 MB indirme yalnızca ilk seferde).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: wasi-sdk önbelleği
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ hashFiles('src-tauri/hlsl/fetch-wasi-sdk.sh') }}
      - name: wasi-sdk 30.0
        run: sh src-tauri/hlsl/fetch-wasi-sdk.sh ~/wasi-sdk
      - name: Yeniden derle ve karşılaştır
        run: |
          WASI_SDK_PATH=~/wasi-sdk/wasi-sdk-30.0-x86_64-linux \
            sh src-tauri/hlsl/build.sh "$RUNNER_TEMP/hlslparser.wasm"
          if ! cmp "$RUNNER_TEMP/hlslparser.wasm" src-tauri/hlsl/hlslparser.wasm; then
            echo "src-tauri/hlsl/hlslparser.wasm kaynağından derlenenle aynı değil."
            echo "Yeniden derleyip commit edin: sh src-tauri/hlsl/build.sh (bkz. dosya başı)"
            exit 1
          fi

  guvenlik:
    name: Güvenlik uyarıları
    # Bilinen açıklar: Rust crate'leri (RustSec) ve pakete giren npm bağımlılıkları. Güvenilmeyen
    # ses dosyası açan bir programda ayrıştırıcı açığı fark edilmeden kalmamalı. Bu iş kırmızıysa
    # test sürümü yayımlanmaz.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust güvenlik uyarıları (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm güvenlik uyarıları (kurulum dosyasını üreten araçlar dahil)
        run: npm audit --audit-level=high
      # İş akışlarının kendisi: güvensiz tetikleyici, komut enjeksiyonu, aşırı izin, sabitlenmemiş
      # eylem (zizmor) ve sözdizimi/kabuk hataları (actionlint). Sürümler sabit; Go modülleri
      # sağlama toplamı veritabanıyla doğrulanır.
      - name: İş akışı denetimi (zizmor, actionlint)
        run: |
          pipx run zizmor==1.31.1 --min-severity=low .github/workflows
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
        env:
          GOFLAGS: -mod=mod
          # zizmor'un çevrimiçi denetimleri (sahte commit, bilinen açıklı eylem) için salt okuma.
          GH_TOKEN: ${{ github.token }}

  sahneler:
    name: Sahneler (Windows, Edge)
    # Gece göğü ve gece otoyolu gerçek Windows'ta, programın kullandığı Edge motoruyla
    # açılır: gölgelendiriciler Windows'ta (ANGLE → Direct3D 11) derlenir mi, görüntü
    # çiziliyor mu, Lyra yıldızları görünüyor mu? Ayrıntı: scripts/check-scenes.mjs
    runs-on: windows-2025
    # Galeri ve MilkDrop'un kare kare parlama ölçümleri uzun sürer; 30 dk'nın dibindeydi.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Arayüzü derle
        run: npm run build
      - name: Sahne denetimi (Edge, Direct3D 11)
        run: npm run check:scenes
        env:
          SCENE_BROWSER_CHANNEL: msedge
          SCENE_BROWSER_ARGS: --use-angle=d3d11 --ignore-gpu-blocklist
      - name: Yedek çizim denetimi (Edge, WebGL kapalı)
        run: npm run check:scenes
        env:
          SCENE_BROWSER_CHANNEL: msedge
          SCENE_BROWSER_ARGS: --disable-webgl --disable-webgl2
          SCENE_EXPECT: fallback

  # Windows işi ikiye bölünür ve iki parça paralel çalışır: takılan ya da kırılan bir parça
  # ötekini bekletmez, hangi parçanın bozulduğu adından görünür. Her adımın kendi süre sınırı var:
  # takılan bir test işi 60 dakika değil, en çok 15 dakika tutar.
  windows-testler:
    name: "Windows: Clippy ve testler"
    # Windows'a özel kod (WASAPI) her push ve PR'da denetlenir: test sürümüne giden commit de
    # Windows'ta sınanmış olur.
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust araç zinciri (rust-toolchain.toml)
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --component clippy
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Arayüzü derle
        run: npm run build
      # WASAPI çıkışı gibi yalnızca Windows'ta derlenen kod burada denetlenir.
      - name: Lint (Clippy, Windows)
        working-directory: src-tauri
        timeout-minutes: 15
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Testler (Windows)
        working-directory: src-tauri
        timeout-minutes: 15
        run: cargo test --locked
      - name: Gerçek ses aygıtıyla deneme
        # Barındırılan Windows makinesinde ses aygıtı yoktur: deneme "ATLANDI" der ve iş akışına
        # uyarı düşer (yeşil ama boş). Gerçek aygıt denemesi proje sahibinin kurulumuyla yapılır (YAY-09).
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo run --locked --example ses_denemesi

  windows-kurulum:
    name: "Windows: kurulum dosyası"
    # Kurulum dosyası PR'larda derlenir; main için "Test sürümü" iş akışında.
    if: github.event_name != 'push'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust araç zinciri (rust-toolchain.toml)
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Kurulum dosyasını derle
        timeout-minutes: 30
        # Tauri CLI doğrudan: üçüncü taraf eylem ve token gerekmez. Derleme kodu etiket olarak PR'ın
        # ucudur; içerik ise GitHub'ın PR'ı main ile birleştirdiği hâlidir (deneme dosyası, yayın değil).
        env:
          LYRASKA_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run tauri build -- --ci -- --locked
      - name: WebView2 önyükleyicisi Microsoft imzalı mı
        shell: pwsh
        run: ./scripts/webview2-imzasi.ps1
      - name: Kurulum dosyasını yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lyraska-Kurulum-PR
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Hata ayıklama sembollerini yükle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lyraska-Semboller-PR
          path: src-tauri/target/release/*.pdb
          if-no-files-found: warn
          retention-days: 14

  # `main`'in koruma kuralı bu adı zorunlu denetim olarak bekler: iki Windows parçasının ortak
  # sonucu. Parçalardan biri kırmızıysa (ya da iptal olduysa) bu da kırmızıdır; kurulum dosyası
  # push'ta derlenmediği için orada "atlandı" sayılır.
  windows:
    name: Windows (Clippy, testler, kurulum dosyası)
    needs: [windows-testler, windows-kurulum]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: İki Windows parçası da geçti mi
        env:
          TESTLER: ${{ needs.windows-testler.result }}
          KURULUM: ${{ needs.windows-kurulum.result }}
          OLAY: ${{ github.event_name }}
        run: |
          echo "Clippy ve testler: $TESTLER · kurulum dosyası: $KURULUM"
          [ "$TESTLER" = success ] || exit 1
          if [ "$OLAY" = push ]; then
            [ "$KURULUM" = skipped ] || [ "$KURULUM" = success ] || exit 1
          else
            [ "$KURULUM" = success ] || exit 1
          fi
