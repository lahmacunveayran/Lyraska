# main'de CI yeşil bitince Windows kurulum dosyasını derler ve "test-surumu" adlı
# sabit GitHub Release'ini yeniler. İndirme linki hiç değişmez:
# https://github.com/lahmacunveayran/Lyraska/releases/download/test-surumu/Lyraska-Kurulum.exe
#
# Güvenlik (DENETIM.md C1, C2, C4; DENETIM-FAZ0.md G1, G2, G12, G14):
# - CI'yi bekler (`workflow_run`), ama yalnızca bu deponun `main` dalına yapılan push'un CI'sini.
#   `branches: [main]` süzgeci tek başına yetmez: dal adına bakar, fork'taki `main` adlı daldan
#   açılan bir PR'ın CI'si de "main" sayılır. Olay türü ve depo ayrıca denetlenir.
# - Derleme önbelleksizdir: yayın derlemesi önceki çalıştırmaların bıraktığı hiçbir şeye güvenmez.
# - Derleme işinin yazma izni yoktur; yazma izni yalnızca Release'i yenileyen, kod çalıştırmayan işte.
# - Yayın, derlenen commit hâlâ main'in ucuysa yapılır: "Re-run" ya da gecikmiş bir çalıştırma eski
#   bir sürümü sabit linke geri koyamaz.
# - Kurulum dosyasına GitHub'ın derleme kanıtı (build provenance attestation) eklenir: dosyanın bu
#   depodaki hangi commit'ten, hangi iş akışıyla derlendiği imzalı olarak doğrulanabilir.
# - Üçüncü taraf eylemler commit SHA'sıyla sabitlenir; `checkout` kimlik bilgisi bırakmaz.
# - Yayın iptal edilmez, sıraya girer; yeni dosya önce ayrı adla yüklenir, eskisi sonra silinir.
name: Test sürümü

on:
  # Yalnızca bu deponun main push'u kabul edilir (derle.if); derlenen kod main'in kendisidir, PR kodu
  # değil. zizmor'un genel uyarısı bu yüzden bu satırda susturulur.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Aynı anda tek yayın; yenisi eskisini iptal etmez, bekler (yarıda kalan yayın linki boş bırakabilir).
concurrency:
  group: test-surumu
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: test-surumu
  ASSET_NAME: Lyraska-Kurulum.exe
  # Söz paketi (sözleri sese oturtan model; Omnilingual ASR, Apache-2.0): elle bir kez yüklenir, her
  # yenilemede korunur. Boyutu ve SHA-256'sı programın beklediği (src-tauri/src/analysis/lyrics_package.rs;
  # check:rules denetler).
  PACKAGE_NAME: Lyraska-Soz-Paketi.onnx
  PACKAGE_SHA256: e3042b2f3b3ef0af2211bf99d2b4bf94a21f5ac0e9898827e7dd6d003a860e91

jobs:
  derle:
    name: Kurulum dosyasını derle
    # Elle başlatma yalnızca main'den. Otomatik başlatma yalnızca bu deponun main'ine yapılan
    # push'un CI'si başarıyla bittiğinde (PR'ların, özellikle fork PR'larının CI'si sayılmaz).
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      # Elle başlatmada commit'in CI sonucunu okumak için (yalnızca okuma).
      actions: read
    outputs:
      sha: ${{ steps.kaynak.outputs.sha }}
      version: ${{ steps.surum.outputs.version }}
    steps:
      - name: Derlenecek commit
        id: kaynak
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
      # Elle başlatma CI'yi atlayamaz: main'in bu commit'i için push CI'si başarıyla bitmiş olmalı
      # (otomatik başlatmada bu, derle.if'te zaten denetlenir).
      - name: Elle başlatmada CI yeşil mi
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.kaynak.outputs.sha }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::$SHA için başarılı bir CI çalıştırması yok; test sürümü yayımlanmaz."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.kaynak.outputs.sha }}
          persist-credentials: false
      # Önbellek yok (npm ve Rust): bkz. dosya başı.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node v5, package.json'a `packageManager` eklenirse önbelleği kendiliğinden açar.
          package-manager-cache: false
      - name: Rust araç zinciri (rust-toolchain.toml)
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
      - run: npm ci
      - name: Sürüm numarası
        id: surum
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Kurulum dosyasını derle
        # Tauri CLI doğrudan: üçüncü taraf eylem ve token gerekmez. `--locked`: Cargo.lock aynen.
        # LYRASKA_COMMIT: programın Ayarlar > Program'da gösterdiği derleme kodu (derlenen commit).
        env:
          LYRASKA_COMMIT: ${{ steps.kaynak.outputs.sha }}
        run: npm run tauri build -- --ci -- --locked
      # Kuruluma gömülen ve karmasız indirilen Microsoft dosyası: imzası doğrulanmadan yayımlanmaz.
      - name: WebView2 önyükleyicisi Microsoft imzalı mı
        shell: pwsh
        run: ./scripts/webview2-imzasi.ps1
      - name: Kurulum dosyasını sabit ada kopyala
        shell: pwsh
        env:
          VERSION: ${{ steps.surum.outputs.version }}
        run: |
          $exe = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/Lyraska_${env:VERSION}_*-setup.exe")
          if ($exe.Count -ne 1) { throw "Sürüm $env:VERSION için tam bir kurulum dosyası bekleniyordu, $($exe.Count) bulundu" }
          Copy-Item $exe[0].FullName $env:ASSET_NAME
          Write-Host "Kurulum dosyası: $($exe[0].Name) -> $env:ASSET_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kurulum
          path: ${{ env.ASSET_NAME }}
          if-no-files-found: error
          retention-days: 7
      - name: Hata ayıklama sembollerini sakla
        # Çökme günlüğündeki yığın izini çözmek için (YAY-11); pakete girmez, 90 gün saklanır.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semboller-${{ steps.surum.outputs.version }}-${{ steps.kaynak.outputs.sha }}
          path: src-tauri/target/release/*.pdb
          if-no-files-found: warn
          retention-days: 90

  yayinla:
    name: test-surumu Release'ini yenile
    needs: derle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Bu iş depo kodunu indirmez ve çalıştırmaz.
    permissions:
      contents: write # Release dosyasını ve etiketi yenilemek için
      id-token: write # derleme kanıtını Sigstore ile imzalamak için
      attestations: write # derleme kanıtını depoya kaydetmek için
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.derle.outputs.sha }}
      VERSION: ${{ needs.derle.outputs.version }}
    steps:
      - name: Derlenen commit hâlâ main'in ucu mu
        # "Re-run", sıradaki eski bir çalıştırma ya da derleme sırasında gelen yeni bir push: sabit
        # linke yalnızca en güncel main çıkar. Daha yeni bir main varsa onun yayını zaten gelecek.
        id: guncel
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$head" = "$SHA" ]; then
            echo "yayinla=true" >> "$GITHUB_OUTPUT"
          else
            echo "yayinla=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Derlenen commit ($SHA) main'in ucu değil ($head); yayın atlandı."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.guncel.outputs.yayinla == 'true'
        with:
          name: kurulum
      - name: Derleme kanıtı (attestation)
        if: steps.guncel.outputs.yayinla == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET_NAME }}
      - name: Sürüm notlarını hazırla
        if: steps.guncel.outputs.yayinla == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short_sha=${SHA::7}
          date=$(TZ=Europe/Istanbul date +'%d.%m.%Y %H:%M')
          sha256=$(sha256sum "$ASSET_NAME" | cut -d' ' -f1)
          cat > notlar.md <<NOTES
          **En güncel test sürümü** — \`main\`'de CI yeşil bittiğinde otomatik yenilenir.

          - Sürüm: \`$VERSION\` · derleme kodu \`$short_sha\` (programda **Ayarlar → Program**'da yazar)
          - Commit: [\`$short_sha\`](https://github.com/$GH_REPO/commit/$SHA)
          - Derlenme: $date (İstanbul)
          - SHA-256 (\`$ASSET_NAME\`): \`$sha256\`
          - Derleme kanıtı: dosyanın bu depoda bu commit'ten derlendiği GitHub'da imzalı olarak kayıtlı
            ([Attestations](https://github.com/$GH_REPO/attestations); doğrulama:
            \`gh attestation verify $ASSET_NAME --repo $GH_REPO --signer-workflow $GH_REPO/.github/workflows/test-surumu.yml --source-ref refs/heads/main\`)
          - Hata ayıklama sembolleri: [derleme çalıştırmasının "semboller" dosyası]($RUN_URL) (90 gün)

          ### Kurulum
          1. **$ASSET_NAME** dosyasını indirin ve çift tıklayın.
          2. Windows "Windows kişisel bilgisayarınızı korudu" derse **Ek bilgi** → **Yine de çalıştır**'a basın.
             (Program henüz dijital olarak imzalanmadığı için bu uyarı normaldir; imzalama Faz 4'te.)
          3. Kurulum yönetici izni istemez; program Başlat menüsüne "Lyraska" adıyla eklenir.

          ### Söz paketi (isteğe bağlı, 349 MB)
          Zamansız sözleri şarkının sesine kendiliğinden oturtur. Bir kez eklenir; program internete bağlanmaz.
          1. **$PACKAGE_NAME** dosyasını indirin.
          2. Lyraska'da **Sözler** panelinde **Söz paketini ekle…** düğmesine basıp bu dosyayı seçin.
          - SHA-256: \`$PACKAGE_SHA256\` (program eklerken denetler)
          - Model: Omnilingual ASR (Meta), Apache-2.0; lisans metni programın içinde.
          NOTES
      - name: Dosyayı yükle, sonra etiketi ve notları yenile
        if: steps.guncel.outputs.yayinla == 'true'
        run: |
          set -euo pipefail
          # Sıra önemli: önce yeni dosya yerine oturur, etiket ve notlar ancak ondan sonra değişir.
          # Yükleme yarıda kalırsa Release eski dosyası, eski etiketi ve eski notlarıyla tutarlı kalır.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$SHA" >/dev/null
            gh release create "$RELEASE_TAG" --verify-tag --title "Test sürümü (en güncel)" \
              --notes-file notlar.md --prerelease
          fi

          # Yeni dosya önce geçici adla yüklenir; eskisi ancak yenisi yerindeyken silinir ve yenisi
          # sabit ada çevrilir: link en kısa süre boş kalır.
          temp_name="$ASSET_NAME.yeni"
          cp "$ASSET_NAME" "$temp_name"
          gh release upload "$RELEASE_TAG" "$temp_name" --clobber
          assets=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets[] | "\(.id) \(.name)"')
          while read -r id name; do
            [ -n "$id" ] || continue
            # Söz paketi korunur: kurulum dosyasından bağımsız, elle yüklenir.
            if [ "$name" != "$temp_name" ] && [ "$name" != "$PACKAGE_NAME" ]; then
              echo "Eski dosya siliniyor: $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id" >/dev/null
            fi
          done <<< "$assets"
          new_id=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name==\"$temp_name\") | .id")
          gh api -X PATCH "repos/$GH_REPO/releases/assets/$new_id" -f name="$ASSET_NAME" >/dev/null

          # Etiketi bu commit'e taşı (Release aynı kalır, böylece link değişmez); git kimlik bilgisi
          # yok, API ile. Sonra notlar.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$SHA" -F force=true >/dev/null
          gh release edit "$RELEASE_TAG" --title "Test sürümü (en güncel)" --notes-file notlar.md --prerelease
          echo "İndirme linki: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$ASSET_NAME"
