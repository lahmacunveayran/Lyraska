# Haftalık güvenlik taraması: kod değişmese de yeni açıklanan güvenlik açıkları (RustSec, npm)
# ve deponun güvenlik duruşu (OpenSSF Scorecard) her hafta denetlenir. Scorecard sonuçları
# GitHub'da Security → Code scanning altında görünür; dışarıya yayımlanmaz.
name: Güvenlik taraması

on:
  schedule:
    - cron: "17 6 * * 1" # her pazartesi 09:17 (İstanbul)
  workflow_dispatch:

permissions: {}

jobs:
  uyarilar:
    name: Bilinen açıklar (RustSec, npm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust güvenlik uyarıları (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm güvenlik uyarıları
        run: npm audit --audit-level=high

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # iş akışı çalıştırmalarını okumak için
      security-events: write # sonuçları Code scanning'e yüklemek için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
