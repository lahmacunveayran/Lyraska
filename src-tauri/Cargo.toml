[package]
name = "lyraska"
version = "0.0.64"
description = "Görselleri şarkıyı önceden bilen, çevrimdışı müzik çalar"
authors = ["Lyraska katkıcıları"]
license = "GPL-3.0-only"
repository = "https://github.com/lahmacunveayran/Lyraska"
edition = "2021"
rust-version = "1.97"

[lib]
# `_lib` soneki Windows'ta bin ve lib adlarının çakışmasını önler.
name = "lyraska_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["all", "opt-simd"] }
rtrb = "0.4"
thiserror = "2"
tauri-plugin-dialog = "2"
rustfft = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
serde_json = { version = "1", features = ["float_roundtrip"] }
rubato = "5"
miniz_oxide = "0.8"
# MilkDrop gölgelendirici çevirici (projectM hlslparser → WebAssembly) kum havuzunda: saf Rust
# yorumlayıcı, yakıt ve bellek sınırıyla (milkdrop/shader.rs).
# "portable-dispatch": komutlar döngüyle işlenir (kararlı Rust'ta kuyruk çağrısı yok; öteki yol
# derin WebAssembly çağrılarında programın kendi yığınını taşırır).
wasmi = { version = "2.0.0", default-features = false, features = [
  "std",
  "validate",
  "portable-dispatch",
] }
# Uygulama veri klasörleri Tauri açılmadan önce bulunur (günlük ve tek örnek kilidi için); Tauri
# de aynı crate'i aynı kuralla kullanır (yeni paket gelmez).
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Çökme günlüğündeki yığın izi çözülebilsin (YAY-11): satır tabloları ayrı sembol dosyasına
# (Windows'ta .pdb) gider, CI onu saklar; exe'nin kendisi küçük kalır.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Yarım kod yolları (CLAUDE.md: kütüphane kodunda panic yok). `unreachable` açılamaz: Tauri'nin
# `#[tauri::command]` makrosunun ürettiği kodda geçer.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Her `#[allow]` gerekçesini taşır: kuralı susturan yer neden susturduğunu söyler.
allow_attributes_without_reason = "warn"

[target."cfg(windows)".dependencies]
wasapi = "0.25"
# Ses iş parçacığına MMCSS "Pro Audio" önceliği (yalnızca output/wasapi.rs; wasapi zaten bu
# crate'i kullanır, yeni paket gelmez).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
allocation-counter = "0.8.1"
ts-rs = "12.0.1"

# Testler gerçek uzunlukta ses işler (ör. EBU 3341'in 80 saniyelik durumları); hafif
# iyileştirme testleri birkaç kat hızlandırır, derleme süresini az artırır.
[profile.test]
opt-level = 1
